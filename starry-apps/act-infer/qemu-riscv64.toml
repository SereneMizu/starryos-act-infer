args = [
    "-nographic",
    "-m", "350M",
    "-cpu", "rv64",
    "-device", "virtio-blk-pci,drive=disk0",
    "-drive", "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-riscv64-act-infer.img",
    "-device", "virtio-net-pci,netdev=net0",
    "-netdev", "user,id=net0",
]
uefi = false
to_bin = true
shell_prefix = "root@starry:"
shell_init_cmd = "/opt/act-infer/act-infer-test.sh"
success_regex = ["(?m)^ACT_INFER_OK\\s*$"]
fail_regex = [
    "(?m)^ACT_INFER_FAIL",
    "(?i)kernel panic",
    "(?i)panicked at",
    "(?i)segmentation fault",
    "(?i)illegal instruction",
    "(?i)bus error",
    "(?i)out of memory",
]
timeout = 600
